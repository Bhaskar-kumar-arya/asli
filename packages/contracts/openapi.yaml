                        minimum: 0
                        maximum: 1
                      manufacturer:
                        type: number
                        minimum: 0
                        maximum: 1
                      productName:
                        type: number
                        minimum: 0
                        maximum: 1
                      expMonth:
                        type: number
                        minimum: 0
                        maximum: 1
