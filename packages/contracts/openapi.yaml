openapi: 3.0.3
info:
  title: Asli API
  version: "1"
  description: CDSCO NSQ/Spurious batch checker - see docs/API.md for the source of truth.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (Cognito idToken)
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - EXTRACTION_FAILED
                - INTERNAL
            message:
              type: string
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
      required:
        - error
    MedicineIdentity:
      type: object
      properties:
        productName:
          type: string
        brandName:
          type: string
        batchNumber:
          type: string
          minLength: 1
        manufacturer:
          type: string
        mfgMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        expMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        strength:
          type: string
        dosageForm:
          type: string
        mrp:
          type: string
        quantity:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        source:
          type: string
          enum: &a1
            - strip_vision
            - bill_vision
            - qr
            - manual
            - pharmacy_csv
        fieldConfidence:
          type: object
          properties:
            batchNumber:
              type: number
              minimum: 0
              maximum: 1
            manufacturer:
              type: number
              minimum: 0
              maximum: 1
            productName:
              type: number
              minimum: 0
              maximum: 1
            expMonth:
              type: number
              minimum: 0
              maximum: 1
      required:
        - batchNumber
        - source
    AlertSummary:
      type: object
      properties:
        alertRef:
          type: string
        alertMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        category:
          type: string
          enum: &a2
            - NSQ
            - SPURIOUS
        productName:
          type: string
        batchRaw:
          type: string
        manufacturerRaw:
          type: string
        mfgMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        expMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        reasonCode:
          type: string
          enum: &a3
            - DISSOLUTION
            - ASSAY
            - IDENTIFICATION
            - DISINTEGRATION
            - STERILITY
            - PARTICULATE
            - MICROBIAL
            - RELATED_SUBSTANCES
            - PH
            - DESCRIPTION
            - UNIFORMITY
            - LABELLING
            - SPURIOUS
            - OTHER
        reasonRaw:
          type: string
        reportingSource:
          type: string
        reportingLab:
          type: string
        sourceUrl:
          type: string
          format: uri
        demo:
          type: boolean
      required:
        - alertRef
        - alertMonth
        - category
        - productName
        - batchRaw
        - manufacturerRaw
        - reasonCode
        - reasonRaw
        - reportingSource
        - sourceUrl
        - demo
    CheckItemResult:
      type: object
      properties:
        identity:
          type: object
          properties:
            productName:
              type: string
            brandName:
              type: string
            batchNumber:
              type: string
              minLength: 1
            manufacturer:
              type: string
            mfgMonth:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            expMonth:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            strength:
              type: string
            dosageForm:
              type: string
            mrp:
              type: string
            quantity:
              type: integer
              minimum: 0
              exclusiveMinimum: true
            source:
              type: string
              enum: *a1
            fieldConfidence:
              type: object
              properties:
                batchNumber:
                  type: number
                  minimum: 0
                  maximum: 1
                manufacturer:
                  type: number
                  minimum: 0
                  maximum: 1
                productName:
                  type: number
                  minimum: 0
                  maximum: 1
                expMonth:
                  type: number
                  minimum: 0
                  maximum: 1
          required:
            - batchNumber
            - source
        tier:
          type: string
          enum: &a4
            - FLAGGED
            - VERIFY
            - NO_ALERT_FOUND
        reasonCodes:
          type: array
          items:
            type: string
            enum: &a5
              - BATCH_EXACT
              - BATCH_NEAR
              - MFR_STRONG
              - MFR_WEAK
              - MFR_UNKNOWN
              - MFR_FROM_BRAND_MAP
              - EXPIRY_DIFFERS
              - LOW_READ_CONFIDENCE
        matches:
          type: array
          items:
            type: object
            properties:
              alertRef:
                type: string
              alertMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              category:
                type: string
                enum: *a2
              productName:
                type: string
              batchRaw:
                type: string
              manufacturerRaw:
                type: string
              mfgMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              expMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              reasonCode:
                type: string
                enum: *a3
              reasonRaw:
                type: string
              reportingSource:
                type: string
              reportingLab:
                type: string
              sourceUrl:
                type: string
                format: uri
              demo:
                type: boolean
            required:
              - alertRef
              - alertMonth
              - category
              - productName
              - batchRaw
              - manufacturerRaw
              - reasonCode
              - reasonRaw
              - reportingSource
              - sourceUrl
              - demo
        checkedAgainst:
          type: object
          properties:
            monthCount:
              type: integer
              minimum: 0
            latestMonth:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
          required:
            - monthCount
            - latestMonth
        guidanceKey:
          type: string
      required:
        - identity
        - tier
        - reasonCodes
        - matches
        - checkedAgainst
        - guidanceKey
    CreateUploadRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
            - strip
            - bill
            - pharmacy
        contentType:
          type: string
      required:
        - kind
        - contentType
    CreateUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - uploadId
        - url
        - expiresAt
    ScanRequest:
      type: object
      properties:
        uploadId:
          type: string
        kind:
          type: string
          enum:
            - strip
            - bill
        qrText:
          type: string
      required:
        - uploadId
        - kind
    ScanResponse:
      type: object
      properties:
        scanId:
          type: string
        method:
          type: string
          enum:
            - strip_vision
            - bill_vision
            - qr
        items:
          type: array
          items:
            type: object
            properties:
              productName:
                type: string
              brandName:
                type: string
              batchNumber:
                type: string
                minLength: 1
              manufacturer:
                type: string
              mfgMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              expMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              strength:
                type: string
              dosageForm:
                type: string
              mrp:
                type: string
              quantity:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              source:
                type: string
                enum: *a1
              fieldConfidence:
                type: object
                properties:
                  batchNumber:
                    type: number
                    minimum: 0
                    maximum: 1
                  manufacturer:
                    type: number
                    minimum: 0
                    maximum: 1
                  productName:
                    type: number
                    minimum: 0
                    maximum: 1
                  expMonth:
                    type: number
                    minimum: 0
                    maximum: 1
            required:
              - batchNumber
              - source
        results:
          type: array
          items:
            type: object
            properties:
              identity:
                type: object
                properties:
                  productName:
                    type: string
                  brandName:
                    type: string
                  batchNumber:
                    type: string
                    minLength: 1
                  manufacturer:
                    type: string
                  mfgMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  expMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  strength:
                    type: string
                  dosageForm:
                    type: string
                  mrp:
                    type: string
                  quantity:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  source:
                    type: string
                    enum: *a1
                  fieldConfidence:
                    type: object
                    properties:
                      batchNumber:
                        type: number
                        minimum: 0
                        maximum: 1
                      manufacturer:
                        type: number
                        minimum: 0
                        maximum: 1
                      productName:
                        type: number
                        minimum: 0
                        maximum: 1
                      expMonth:
                        type: number
                        minimum: 0
                        maximum: 1
                required:
                  - batchNumber
                  - source
              tier:
                type: string
                enum: *a4
              reasonCodes:
                type: array
                items:
                  type: string
                  enum: *a5
              matches:
                type: array
                items:
                  type: object
                  properties:
                    alertRef:
                      type: string
                    alertMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    category:
                      type: string
                      enum: *a2
                    productName:
                      type: string
                    batchRaw:
                      type: string
                    manufacturerRaw:
                      type: string
                    mfgMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    expMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    reasonCode:
                      type: string
                      enum: *a3
                    reasonRaw:
                      type: string
                    reportingSource:
                      type: string
                    reportingLab:
                      type: string
                    sourceUrl:
                      type: string
                      format: uri
                    demo:
                      type: boolean
                  required:
                    - alertRef
                    - alertMonth
                    - category
                    - productName
                    - batchRaw
                    - manufacturerRaw
                    - reasonCode
                    - reasonRaw
                    - reportingSource
                    - sourceUrl
                    - demo
              checkedAgainst:
                type: object
                properties:
                  monthCount:
                    type: integer
                    minimum: 0
                  latestMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                required:
                  - monthCount
                  - latestMonth
              guidanceKey:
                type: string
            required:
              - identity
              - tier
              - reasonCodes
              - matches
              - checkedAgainst
              - guidanceKey
        warnings:
          type: array
          items:
            type: string
            enum:
              - LOW_READ_CONFIDENCE
              - NO_BATCH_ON_LINE
              - NOT_A_MEDICINE
      required:
        - scanId
        - method
        - items
        - results
        - warnings
    CheckRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productName:
                type: string
              brandName:
                type: string
              batchNumber:
                type: string
                minLength: 1
              manufacturer:
                type: string
              mfgMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              expMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              strength:
                type: string
              dosageForm:
                type: string
              mrp:
                type: string
              quantity:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              source:
                type: string
                enum: *a1
              fieldConfidence:
                type: object
                properties:
                  batchNumber:
                    type: number
                    minimum: 0
                    maximum: 1
                  manufacturer:
                    type: number
                    minimum: 0
                    maximum: 1
                  productName:
                    type: number
                    minimum: 0
                    maximum: 1
                  expMonth:
                    type: number
                    minimum: 0
                    maximum: 1
            required:
              - batchNumber
              - source
          minItems: 1
          maxItems: 50
      required:
        - items
    CheckResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              identity:
                type: object
                properties:
                  productName:
                    type: string
                  brandName:
                    type: string
                  batchNumber:
                    type: string
                    minLength: 1
                  manufacturer:
                    type: string
                  mfgMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  expMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                  strength:
                    type: string
                  dosageForm:
                    type: string
                  mrp:
                    type: string
                  quantity:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  source:
                    type: string
                    enum: *a1
                  fieldConfidence:
                    type: object
                    properties:
                      batchNumber:
                        type: number
                        minimum: 0
                        maximum: 1
                      manufacturer:
                        type: number
                        minimum: 0
                        maximum: 1
                      productName:
                        type: number
                        minimum: 0
                        maximum: 1
                      expMonth:
                        type: number
                        minimum: 0
                        maximum: 1
                required:
                  - batchNumber
                  - source
              tier:
                type: string
                enum: *a4
              reasonCodes:
                type: array
                items:
                  type: string
                  enum: *a5
              matches:
                type: array
                items:
                  type: object
                  properties:
                    alertRef:
                      type: string
                    alertMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    category:
                      type: string
                      enum: *a2
                    productName:
                      type: string
                    batchRaw:
                      type: string
                    manufacturerRaw:
                      type: string
                    mfgMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    expMonth:
                      type: string
                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    reasonCode:
                      type: string
                      enum: *a3
                    reasonRaw:
                      type: string
                    reportingSource:
                      type: string
                    reportingLab:
                      type: string
                    sourceUrl:
                      type: string
                      format: uri
                    demo:
                      type: boolean
                  required:
                    - alertRef
                    - alertMonth
                    - category
                    - productName
                    - batchRaw
                    - manufacturerRaw
                    - reasonCode
                    - reasonRaw
                    - reportingSource
                    - sourceUrl
                    - demo
              checkedAgainst:
                type: object
                properties:
                  monthCount:
                    type: integer
                    minimum: 0
                  latestMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                required:
                  - monthCount
                  - latestMonth
              guidanceKey:
                type: string
            required:
              - identity
              - tier
              - reasonCodes
              - matches
              - checkedAgainst
              - guidanceKey
      required:
