    AlertDetail:
      type: object
      properties:
        alertRef:
          type: string
        alertMonth:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        category:
          type: string
          enum: *a2
        productName:
          type: string
        batchRaw:
          type: string
        manufacturerRaw:
          type: string
        mfgMonth:
