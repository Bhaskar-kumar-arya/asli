              forPerson:
                type: string
              addedBy:
                type: string
              addedAt:
                type: string
                format: date-time
              lastCheckedAt:
                type: string
                format: date-time
              latestTier:
                type: string
                enum: &a7
                  - FLAGGED
                  - VERIFY
                  - NO_ALERT_FOUND
                  - PENDING
            required:
              - medId
              - identity
              - addedBy
              - addedAt
              - latestTier
        matches:
          type: array
          items:
            type: object
            properties:
              medId:
                type: string
              alertRef:
                type: string
              tier:
                type: string
                enum:
                  - FLAGGED
                  - VERIFY
              category:
                type: string
                enum: *a2
              alertMonth:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
              createdAt:
                type: string
                format: date-time
            required:
              - medId
              - alertRef
              - tier
              - category
              - alertMonth
              - createdAt
      required:
