        - productName
        - batchRaw
        - manufacturerRaw
        - reasonCode
        - reasonRaw
        - reportingSource
        - sourceUrl
        - demo
        - snapshotKey
        - ingestedAt
    CabinetList:
      type: object
      properties:
        cabinets:
          type: array
          items:
            type: object
            properties:
              cabinetId:
                type: string
              name:
                type: string
              createdBy:
                type: string
              createdAt:
                type: string
                format: date-time
              role:
                type: string
                enum: &a6
                  - OWNER
                  - EDITOR
                  - VIEWER
            required:
              - cabinetId
              - name
              - createdBy
              - createdAt
              - role
        nextToken:
          type: string
      required:
        - cabinets
    CreateCabinetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name
    Cabinet:
      type: object
      properties:
        cabinetId:
          type: string
        name:
