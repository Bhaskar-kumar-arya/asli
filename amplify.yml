version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.15.0 --activate
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @asli/web build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/.pnpm-store/**/*
